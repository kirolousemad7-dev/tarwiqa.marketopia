<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Secure Partner Account</title>
        <link rel="stylesheet" href="./partner-login.css" />
        <link rel="stylesheet" href="./partner-change-password.css" />
    </head>
    <body>
        <main class="password-page">
            <form class="login-card" id="changePasswordForm">
                <p class="eyebrow">First Login Security</p>
                <h1>Create A New Password</h1>
                <p>
                    Your temporary password must be replaced before opening the
                    Partner Workspace.
                </p>
                <label class="field-group"
                    ><span>New Password</span>
                    <div class="password-wrap">
                        <input
                            id="newPassword"
                            type="password"
                            minlength="8"
                            required
                        /><button
                            class="show-password-btn"
                            type="button"
                            data-toggle="newPassword"
                        >
                            Show
                        </button>
                    </div></label
                ><label class="field-group"
                    ><span>Confirm New Password</span>
                    <div class="password-wrap">
                        <input
                            id="confirmPassword"
                            type="password"
                            minlength="8"
                            required
                        /><button
                            class="show-password-btn"
                            type="button"
                            data-toggle="confirmPassword"
                        >
                            Show
                        </button>
                    </div></label
                >
                <p
                    class="form-message"
                    id="changePasswordMessage"
                    aria-live="polite"
                ></p>
                <button class="login-btn" type="submit">
                    <span>Save & Open Workspace</span>
                </button>
            </form>
        </main>
        <script src="./partner-change-password.js"></script>
    </body>
</html>
