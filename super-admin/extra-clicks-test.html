<!doctype html><meta charset="utf-8"><div id="result">RUNNING</div><iframe id="app" src="extra-comments.html"></iframe><script>
const out=document.getElementById('result'),frame=document.getElementById('app');frame.onload=()=>setTimeout(()=>{try{const w=frame.contentWindow,d=frame.contentDocument;w.Element.prototype.scrollIntoView=function(){};let c=[];d.querySelector('#createExtraBtn').click();c.push(d.activeElement===d.querySelector('#shortNoteInput'));d.querySelector('#extraReasonInput').value='Browser test';d.querySelector('#extraDescriptionInput').value='Temporary browser test extra';d.querySelector('#shortNoteInput').value='Test Extra';d.querySelector('#saveExtraBtn').click();c.push([...d.querySelectorAll('#extrasListBody strong')].some(x=>x.textContent==='Test Extra'));d.querySelector('[data-extra-name="Test Extra"][data-extra-action="delete"]').click();c.push(!!d.querySelector('[data-extra-name="Test Extra"][data-extra-action="restore"]'));d.querySelector('[data-extra-name="Test Extra"][data-extra-action="restore"]').click();c.push(!!d.querySelector('[data-extra-name="Test Extra"][data-extra-action="delete"]'));d.querySelector('#extraReasonInput').value='reset';d.querySelector('#resetExtraBtn').click();c.push(d.querySelector('#extraReasonInput').value==='');w.HTMLAnchorElement.prototype.click=function(){w.__exportClicked=true};d.querySelector('#exportExtrasBtn').click();c.push(w.__exportClicked===true);w.localStorage.setItem('customExtrasCatalog',JSON.stringify(JSON.parse(w.localStorage.getItem('customExtrasCatalog')||'[]').filter(x=>x.name!=='Test Extra')));w.localStorage.setItem('temporarilyDeletedExtras',JSON.stringify(JSON.parse(w.localStorage.getItem('temporarilyDeletedExtras')||'[]').filter(x=>x!=='Test Extra')));out.textContent=c.every(Boolean)?'PASS: all Extra clicks work.':'FAIL: '+c.join(',')}catch(e){out.textContent='FAIL: '+e.message}},1000);
</script>
