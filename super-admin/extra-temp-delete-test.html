<!doctype html><meta charset="utf-8"><div id="result">RUNNING</div><iframe id="extras" src="extra-comments.html"></iframe><iframe id="orders"></iframe><script>
const out=document.getElementById('result'), extras=document.getElementById('extras'), orders=document.getElementById('orders');
extras.onload=()=>setTimeout(()=>{try{const d=extras.contentDocument; const button=d.querySelector('[data-extra-action="delete"]'); const name=button.dataset.extraName; button.click(); setTimeout(()=>{const restore=d.querySelector(`[data-extra-name="${name}"][data-extra-action="restore"]`); orders.src='under-review-orders.html'; orders.onload=()=>setTimeout(()=>{const od=orders.contentDocument; const options=[...od.querySelectorAll('#modalExtrasSelect option')].map(o=>o.value); const stored=JSON.parse(orders.contentWindow.localStorage.getItem('temporarilyDeletedExtras')||'[]'); const ok=!!restore&&!options.includes(name)&&stored.includes(name); out.textContent=ok?'PASS: list, temporary delete, order exclusion, persistence, and restore are working.':'FAIL'; restore?.click();},1000);},250);}catch(e){out.textContent='FAIL: '+e.message;}},900);
</script>
