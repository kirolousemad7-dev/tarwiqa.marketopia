<!doctype html><meta charset="utf-8"><div id="result">RUNNING</div><iframe id="app" src="done-orders.html"></iframe><script>
const out=document.getElementById('result'),frame=document.getElementById('app');frame.onload=()=>setTimeout(()=>{try{const w=frame.contentWindow,d=frame.contentDocument,c=[];
const back=d.querySelector('#backToAcceptedLink');let backClicked=false;back.addEventListener('click',e=>{e.preventDefault();backClicked=true},{once:true});back.click();c.push(backClicked&&back.getAttribute('href')==='./accepted-orders.html');
const search=d.querySelector('#doneSearchInput');search.value='Youssef';search.dispatchEvent(new Event('input',{bubbles:true}));c.push(d.querySelectorAll('#doneOrdersTableBody tr').length===1);search.value='';search.dispatchEvent(new Event('input',{bubbles:true}));
const sort=d.querySelector('#doneSortSelect');sort.value='cityAsc';sort.dispatchEvent(new Event('change',{bubbles:true}));c.push(d.querySelector('#doneOrdersTableBody tr td:nth-child(3)').textContent==='Alexandria');
let exportClicked=false;const originalClick=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){exportClicked=true};d.querySelector('#exportDoneOrdersBtn').click();c.push(exportClicked);w.HTMLAnchorElement.prototype.click=originalClick;
let written='',printed=false;w.open=()=>({document:{write:v=>written+=v,close:()=>{}},focus:()=>{},print:()=>{printed=true}});d.querySelector('[data-done-action="print"]').click();c.push(printed&&written.includes('Customer Address')&&written.includes('Assigned Partner'));
const view=()=>d.querySelector('[data-done-action="view"]').click();view();c.push(!d.querySelector('#doneOrderModal').classList.contains('hidden')&&d.querySelectorAll('#doneOrderModalContent .done-detail-field').length===23);d.querySelector('#closeDoneOrderModalBtn').click();c.push(d.querySelector('#doneOrderModal').classList.contains('hidden'));view();d.querySelector('#closeDoneOrderFooterBtn').click();c.push(d.querySelector('#doneOrderModal').classList.contains('hidden'));view();d.querySelector('#doneOrderModal').dispatchEvent(new MouseEvent('click',{bubbles:true}));c.push(d.querySelector('#doneOrderModal').classList.contains('hidden'));view();d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));c.push(d.querySelector('#doneOrderModal').classList.contains('hidden'));
out.textContent=c.every(Boolean)?'PASS: all Done Orders clicks work.':'FAIL: '+c.join(',')}catch(e){out.textContent='FAIL: '+e.message}},1200);
</script>
